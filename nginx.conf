# The page is static. /api/ask goes to the Librarian service on the lab server over WireGuard.
# The service applies the real limits (per address, per day, per question); the limit here only
# keeps a flood from reaching it.
# Key the limit on the last address in X-Forwarded-For, the one the front proxy added. The earlier
# entries are whatever the client sent, so the whole header would limit nobody who varies it.
map $http_x_forwarded_for $visitor {
    "~(?:^|,)\s*(?<last>[^,\s]+)\s*$" $last;
    default $remote_addr;
}
limit_req_zone $visitor zone=ask:1m rate=30r/m;
# Over the limit a program is told so, in JSON, with the status for "too many requests". nginx's default is 503 with
# an HTML page, which reads as an outage to a client and to the page.
limit_req_status 429;

# One address for the page: www goes to the bare domain.
server {
    listen 80;
    listen [::]:80;
    server_name www.thelibrarian.energy;
    server_tokens off;
    return 301 https://thelibrarian.energy$request_uri;
}

# default_server matters: without it nginx sends every host that matches no server_name to the FIRST
# server block, which was the www redirect above, and the bare domain redirected to itself for ever.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name thelibrarian.energy _;
    server_tokens off;

    gzip on;
    gzip_proxied any;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # The page is one inline script and one inline style block, plus the analytics script.
    # A location with its own add_header drops these, so the page location repeats the include.
    include /etc/nginx/security_headers.conf;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security_headers.conf;
    }

    location = /api/ask {
        limit_except POST { deny all; }
        limit_req zone=ask burst=5 nodelay;
        client_max_body_size 4k;
        proxy_pass http://10.100.0.2:8790/ask;
        proxy_http_version 1.1;
        # Pass the front proxy's header through unchanged: its last entry is the visitor's address.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }

    # The same answer as server-sent events, with one event as each tool starts.
    location = /api/ask/stream {
        limit_except POST { deny all; }
        limit_req zone=ask burst=5 nodelay;
        client_max_body_size 4k;
        proxy_pass http://10.100.0.2:8790/ask/stream;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }

    # A reader's "useful" or "wrong" on one answer. The service accepts it only for an id it issued.
    location = /api/feedback {
        limit_except POST { deny all; }
        limit_req zone=ask burst=5 nodelay;
        client_max_body_size 2k;
        proxy_pass http://10.100.0.2:8790/feedback;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    error_page 429 = @limited;
    location @limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error": "Too many requests from this address. Wait a minute and try again."}';
    }

    location = /api/stats {
        limit_except GET { deny all; }
        proxy_pass http://10.100.0.2:8790/stats;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}
