# The page is static. /api/ask goes to the Librarian service on the lab server over WireGuard.
# The service applies the real limits (per address, per day, per question); the limit here only
# keeps a flood from reaching it.
limit_req_zone $http_x_forwarded_for zone=ask:1m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache";
    }

    location = /api/ask {
        limit_except POST { deny all; }
        limit_req zone=ask burst=5 nodelay;
        client_max_body_size 4k;
        proxy_pass http://10.100.0.2:8790/ask;
        proxy_http_version 1.1;
        # Pass the front proxy's header through unchanged: its last entry is the visitor's address.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }

    # The same answer as server-sent events, with one event as each tool starts.
    location = /api/ask/stream {
        limit_except POST { deny all; }
        limit_req zone=ask burst=5 nodelay;
        client_max_body_size 4k;
        proxy_pass http://10.100.0.2:8790/ask/stream;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }

    location = /api/stats {
        limit_except GET { deny all; }
        proxy_pass http://10.100.0.2:8790/stats;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}
