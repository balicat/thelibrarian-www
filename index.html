<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Librarian</title>
<meta name="description" content="The Librarian knows energy markets.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0b0b0e;
    color: #e8e2d5;
    font-family: Charter, Georgia, 'Times New Roman', serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  .rule { width: 72px; height: 1px; background: #b08d3f; margin: 26px auto; opacity: 0.8; }
  h1 {
    font-size: clamp(28px, 6vw, 46px);
    letter-spacing: 0.28em; font-weight: 400; text-indent: 0.28em;
  }
  .tag { font-style: italic; color: #9a927f; font-size: clamp(15px, 2.6vw, 19px); }
  form { margin-top: 42px; width: 100%; max-width: 520px; }
  input {
    width: 100%; background: transparent; border: none;
    border-bottom: 1px solid #3a3a42; outline: none;
    color: #e8e2d5; font: inherit; font-size: 17px;
    padding: 10px 2px; text-align: center; caret-color: #b08d3f;
    transition: border-color 0.4s;
  }
  input:focus { border-color: #b08d3f; }
  input::placeholder { color: #55514a; font-style: italic; }
  #answer {
    margin-top: 30px; min-height: 3.2em; font-size: 16.5px; line-height: 1.7;
    color: #c9c2b2; max-width: 560px;
  }
  #answer .cursor { color: #b08d3f; animation: blink 1.1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #sources { margin-top: 18px; max-width: 640px; font: 12.5px/1.8 ui-monospace, Consolas, monospace; color: #857c68; }
  #sources .caveat { font-family: inherit; font-style: italic; color: #6f685a; }
  footer { position: fixed; bottom: 22px; font-size: 12.5px; color: #55514a; letter-spacing: 0.06em; }
  footer a { color: #857c68; text-decoration: none; }
  footer a:hover { color: #b08d3f; }
</style>
</head>
<body>

<h1>THE LIBRARIAN</h1>
<div class="rule"></div>
<div class="tag">knows energy markets.</div>

<form id="ask" autocomplete="off">
  <input id="q" type="text" maxlength="300" placeholder="Ask the Librarian&hellip;" aria-label="Ask the Librarian">
</form>
<div id="answer"><span class="cursor">&#9612;</span></div>
<div id="sources" aria-live="polite"></div>

<footer>an <a href="https://energyscope.io">EnergyScope</a> service</footer>

<script>
  // The Librarian answers from EnergyScope data. Every number shown under "Sources"
  // came back from a tool call; the service rejects an answer whose numbers do not.
  var API = "/api/ask";
  var el = document.getElementById("answer");
  var src = document.getElementById("sources");
  var busy = false;

  function type(text, done) {
    var i = 0;
    (function step() {
      el.textContent = text.slice(0, i);
      var c = document.createElement("span");
      c.className = "cursor"; c.textContent = "▌";
      el.appendChild(c);
      if (i < text.length) { i += 2; setTimeout(step, 14); } else if (done) { done(); }
    })();
  }

  function num(v) {
    return Number(v).toLocaleString("en-GB", { maximumFractionDigits: 2 });
  }

  function showSources(a) {
    (a.facts || []).forEach(function (f) {
      var row = document.createElement("div");
      var line = f.series_id + "  ·  " + num(f.latest_value) + " " + f.units + "  ·  " + f.latest_period;
      if (f.base_period) {
        line += "  ·  " + (f.change_abs >= 0 ? "+" : "") + num(f.change_abs) +
                " (" + (f.change_pct >= 0 ? "+" : "") + num(f.change_pct) + "%) since " + f.base_period;
      }
      row.textContent = line;
      row.title = f.name;
      src.appendChild(row);
    });
    (a.spreads || []).forEach(function (p) {
      var row = document.createElement("div");
      row.textContent = p.series_a + " − " + p.series_b + "  ·  " + num(p.value_a) + " − " + num(p.value_b) +
                        " = " + num(p.spread) + " " + p.units + "  ·  " + p.period;
      row.title = p.name_a + " minus " + p.name_b;
      src.appendChild(row);
    });
    (a.caveats || []).forEach(function (c) {
      var row = document.createElement("div");
      row.className = "caveat"; row.textContent = c;
      src.appendChild(row);
    });
  }

  document.getElementById("ask").addEventListener("submit", function (e) {
    e.preventDefault();
    if (busy) return;
    var q = document.getElementById("q").value.trim();
    if (!q) return;
    busy = true;
    src.textContent = "";
    type("The Librarian is reading…");
    fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: q }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
      .then(function (r) {
        if (!r.ok) { type(r.body.error || "The Librarian could not answer that just now.", function () { busy = false; }); return; }
        type(r.body.summary, function () { showSources(r.body); busy = false; });
      })
      .catch(function () { type("The Librarian cannot be reached just now.", function () { busy = false; }); });
  });
</script>

</body>
</html>
