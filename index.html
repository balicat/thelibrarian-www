<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Librarian: oil and gas market answers that show their sources</title>
<meta name="description" content="Ask an oil or gas market question in plain English. The Librarian answers from EnergyScope data and shows the series, the tool calls and a recomputation check behind every number.">
<link rel="canonical" href="https://thelibrarian.energy/">
<meta name="theme-color" content="#f3ecdc">
<meta property="og:type" content="website">
<meta property="og:site_name" content="The Librarian">
<meta property="og:title" content="The Librarian: oil and gas market answers that show their sources">
<meta property="og:description" content="Ask whether an arbitrage is open, what moved this week, or how stocks compare with the five-year average. Every number comes with its series, the tool calls behind it and a recomputation check.">
<meta property="og:url" content="https://thelibrarian.energy/">
<meta property="og:image" content="https://thelibrarian.energy/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The Librarian: answers oil and gas market questions, and shows where every number came from.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="The Librarian: oil and gas market answers that show their sources">
<meta name="twitter:description" content="Ask an oil or gas market question. Every number comes with its series, the tool calls behind it and a recomputation check.">
<meta name="twitter:image" content="https://thelibrarian.energy/og.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script defer data-domain="thelibrarian.energy" src="https://analytics.lostinkalymnos.com/js/script.js"></script>
<style>
  :root {
    --paper: #f3ecdc; --card: #fdfaf2; --ink: #1b1813; --ink2: #3f392f; --ink3: #655d4e;
    --rule: #d3c8ab; --accent: #8c2a1a; --ok: #256b35; --bad: #a3300f; --blue: #1f4e79;
    --serif: Charter, 'Iowan Old Style', Georgia, 'Times New Roman', serif;
    --mono: ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--paper); color: var(--ink); font-family: var(--serif); font-size: 18px; line-height: 1.6;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 0 16px 28px;
  }
  header { text-align: center; padding: 6vh 0 26px; }
  .mark { display: block; margin: 0 auto 18px; border-radius: 21px; box-shadow: 0 3px 10px rgba(40, 25, 60, 0.28); }
  h1 { font-size: clamp(26px, 5.4vw, 40px); letter-spacing: 0.26em; text-indent: 0.26em; font-weight: 400; }
  .rule { width: 64px; height: 2px; background: var(--accent); margin: 16px auto 14px; }
  .tag { font-style: italic; color: var(--ink2); font-size: 18px; }
  main { width: 100%; max-width: 780px; }

  form { display: flex; gap: 10px; }
  input {
    flex: 1; min-width: 0; font: inherit; font-size: 19px; color: var(--ink); background: #fff;
    border: 1.5px solid var(--ink3); border-radius: 4px; padding: 12px 14px;
  }
  input::placeholder { color: var(--ink3); font-style: italic; }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  button.ask {
    font: inherit; font-size: 18px; color: #fff; background: var(--ink); border: 1.5px solid var(--ink);
    border-radius: 4px; padding: 0 22px; cursor: pointer;
  }
  button.ask:hover { background: var(--accent); border-color: var(--accent); }
  button.ask:disabled { background: var(--ink3); border-color: var(--ink3); cursor: default; }
  #examples { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
  #examples button {
    font: inherit; font-size: 15.5px; color: var(--ink); background: transparent; cursor: pointer;
    border: 1px solid var(--ink3); border-radius: 999px; padding: 4px 13px;
  }
  #examples button:hover { background: var(--ink); color: #fff; }
  #convo { margin-top: 10px; font-size: 15.5px; color: var(--ink2); min-height: 1.6em; }
  #convo button { font: inherit; color: var(--blue); background: none; border: none; text-decoration: underline; cursor: pointer; }

  .card {
    margin-top: 22px; background: var(--card); border: 1px solid var(--rule); border-top: 4px solid var(--accent);
    border-radius: 3px; padding: 22px 26px 20px; box-shadow: 0 1px 0 #fff inset, 0 2px 6px rgba(60, 45, 20, 0.10);
  }
  .card.old { border-top-color: var(--ink3); opacity: 0.92; }
  .label {
    font-family: var(--mono); font-size: 12.5px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--accent); margin: 20px 0 6px;
  }
  .label:first-child { margin-top: 0; }
  .q { font-style: italic; color: var(--ink2); }
  .a { font-size: 20px; line-height: 1.6; color: var(--ink); }
  .a.err { color: var(--bad); }
  .check { font-size: 16px; font-weight: 600; margin-top: 12px; }
  .check.ok { color: var(--ok); } .check.bad { color: var(--bad); }

  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 15.5px; }
  th {
    text-align: left; font-family: var(--mono); font-weight: 600; font-size: 12.5px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--ink2); border-bottom: 1.5px solid var(--ink3); padding: 5px 12px 5px 0;
  }
  td { vertical-align: top; border-bottom: 1px solid var(--rule); padding: 8px 12px 8px 0; color: var(--ink); }
  td.n, th.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  td:last-child, th:last-child { padding-right: 0; }
  .id { font-family: var(--mono); font-size: 14px; color: var(--blue); overflow-wrap: anywhere; }
  .nm { display: block; font-size: 14.5px; color: var(--ink2); }
  .up { color: var(--ok); } .down { color: var(--bad); }

  .reading { border: 1px solid var(--rule); border-radius: 3px; padding: 12px 14px; margin-top: 10px; background: #fff; }
  .reading h3 { font-size: 16.5px; font-weight: 600; line-height: 1.35; }
  .reading .meta { font-size: 14.5px; color: var(--ink2); margin-top: 2px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 16px; margin-top: 10px; }
  .grid div { border-top: 1px solid var(--rule); padding-top: 4px; }
  .grid .k { display: block; font-size: 13.5px; color: var(--ink2); line-height: 1.3; }
  .grid .v { font-size: 18px; font-variant-numeric: tabular-nums; }
  .reading .note { font-size: 14.5px; color: var(--ink2); margin-top: 10px; font-style: italic; }

  ol.steps { margin-left: 22px; font-size: 16px; color: var(--ink); }
  ol.steps li { padding: 1px 0; }
  ol.steps code { font-family: var(--mono); font-size: 14px; color: var(--blue); overflow-wrap: anywhere; }
  ul.caveats { margin-left: 20px; font-size: 16px; color: var(--ink2); }
  .foot { margin-top: 16px; padding-top: 10px; border-top: 1px solid var(--rule); font-size: 14px; color: var(--ink3); font-family: var(--mono); }
  .working { color: var(--ink2); font-style: italic; }
  .working::after { content: "…"; animation: dots 1.4s steps(4, end) infinite; display: inline-block; overflow: hidden; vertical-align: bottom; width: 0; }
  @keyframes dots { to { width: 1.1em; } }
  @media (prefers-reduced-motion: reduce) { .working::after { animation: none; width: 1.1em; } }

  footer { margin-top: auto; padding-top: 44px; font-size: 15px; color: var(--ink2); text-align: center; max-width: 780px; }
  footer a { color: var(--blue); }
  #stats { display: block; margin-bottom: 6px; }
  .nod { display: block; margin-top: 6px; font-size: 14px; color: var(--ink3); }
  @media (max-width: 560px) {
    body { font-size: 17px; } .card { padding: 18px 16px 16px; } form { flex-direction: column; }
    button.ask { padding: 11px 0; } .a { font-size: 18.5px; }
  }
</style>
</head>
<body>

<header>
  <img class="mark" src="/icon-224.png" width="112" height="112" alt="">
  <h1>THE LIBRARIAN</h1>
  <div class="rule"></div>
  <div class="tag">Answers oil and gas market questions, and shows where every number came from.</div>
</header>

<main>
  <form id="ask" autocomplete="off">
    <input id="q" type="text" maxlength="300" placeholder="Ask about prices, stocks, curves, margins, positioning…" aria-label="Your question">
    <button class="ask" id="go" type="submit">Ask</button>
  </form>
  <div id="examples">
    <button type="button">What are this week's surprises?</button>
    <button type="button">Is the arbitrage to ship US crude to Europe open?</button>
    <button type="button">Is the Brent curve in backwardation?</button>
    <button type="button">What is the 3-2-1 crack spread?</button>
    <button type="button">US crude stocks against the five-year average?</button>
    <button type="button">How are funds positioned in WTI?</button>
    <button type="button">How full is EU gas storage?</button>
  </div>
  <div id="convo" aria-live="polite"></div>
  <div id="thread" aria-live="polite"></div>
</main>

<footer>
  <span id="stats"></span>
  An <a href="https://energyscope.io" target="_blank" rel="noopener">EnergyScope</a> service &middot;
  <a href="https://github.com/balicat/energyscope-desk-agent#readme" target="_blank" rel="noopener">How it works, and its test results</a>
  <span class="nod">Named after &lsquo;The Librarian&rsquo; in Neal Stephenson&rsquo;s <cite>Snow Crash</cite> (1992), the novel that also gave us &lsquo;The Metaverse&rsquo;.</span>
</footer>

<script>
  // The model chooses the tools and writes the sentences; code does the sums. An answer whose
  // numbers do not trace to a tool result is sent back, and every answer is recomputed from the
  // data before it is marked as checked. All text below is set with textContent.
  var thread = document.getElementById("thread");
  var box = document.getElementById("q");
  var go = document.getElementById("go");
  var convo = document.getElementById("convo");
  var busy = false;
  var session = null;
  var turns = 0;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function num(v) { return Number(v).toLocaleString("en-GB", { maximumFractionDigits: 2 }); }
  function signed(v) { return (v > 0 ? "+" : "") + num(v); }
  function newSession() {
    var a = new Uint8Array(12);
    crypto.getRandomValues(a);
    return Array.prototype.map.call(a, function (b) { return ("0" + b.toString(16)).slice(-2); }).join("");
  }

  function describe(t) {
    var a = t.args || {}, li = el("li");
    function add(text, code) { li.appendChild(document.createTextNode(text)); if (code) li.appendChild(el("code", "", code)); }
    switch (t.tool) {
      case "search_series": add("Searched " + (a.dataset ? a.dataset + " " : "") + "for “" + a.query + "”"); break;
      case "get_latest": add("Read the latest value of ", (a.series_ids || []).join(", ")); break;
      case "get_change": add("Compared with " + a.lookback_days + " days earlier: ", a.series_id); break;
      case "get_spread": add("Subtracted one series from the other: ", a.series_a + " − " + a.series_b); break;
      case "get_curve": add("Read the " + a.market + " futures curve"); break;
      case "get_crack_spread": add("Computed the " + a.kind + " crack spread"); break;
      case "get_seasonal": add("Compared with the same time of year, " + a.years + " years: ", a.series_id); break;
      case "get_percentile": add("Ranked against its last " + a.years + " years: ", a.series_id); break;
      case "get_positioning": add("Read fund positioning in " + String(a.market).replace(/_/g, " ")); break;
      case "get_surprises": add("Ranked the watchlist's moves over the last " + a.window + " by how unusual they are"); break;
      case "get_arbitrage": add("Assessed the route " + String(a.route).replace(/_/g, " ")); break;
      default: add(t.tool);
    }
    return li;
  }

  function sourcesTable(a) {
    var wrap = el("div", "tablewrap"), table = el("table"), head = el("tr");
    [["Series", ""], ["Value", "n"], ["Date", "n"], ["Change", "n"]].forEach(function (h) { head.appendChild(el("th", h[1], h[0])); });
    table.appendChild(head);
    (a.facts || []).forEach(function (f) {
      var tr = el("tr"), td = el("td");
      td.appendChild(el("span", "id", f.series_id)); td.appendChild(el("span", "nm", f.name));
      tr.appendChild(td);
      tr.appendChild(el("td", "n", num(f.latest_value) + " " + f.units));
      tr.appendChild(el("td", "n", f.latest_period));
      var ch = el("td", "n");
      if (f.base_period) {
        ch.appendChild(el("span", f.change_abs >= 0 ? "up" : "down", signed(f.change_abs) + " (" + signed(f.change_pct) + "%)"));
        ch.appendChild(el("span", "nm", "since " + f.base_period));
      } else { ch.textContent = "—"; }
      tr.appendChild(ch);
      table.appendChild(tr);
    });
    (a.spreads || []).forEach(function (p) {
      var tr = el("tr"), td = el("td");
      td.appendChild(el("span", "id", p.series_a + " − " + p.series_b));
      td.appendChild(el("span", "nm", p.name_a + " minus " + p.name_b));
      tr.appendChild(td);
      tr.appendChild(el("td", "n", num(p.spread) + " " + p.units));
      tr.appendChild(el("td", "n", p.period));
      tr.appendChild(el("td", "n", num(p.value_a) + " − " + num(p.value_b)));
      table.appendChild(tr);
    });
    wrap.appendChild(table);
    return wrap;
  }

  function readingCard(r) {
    var d = el("div", "reading");
    d.appendChild(el("h3", "", r.title));
    d.appendChild(el("div", "meta", r.period + " · " + r.units));
    var g = el("div", "grid");
    Object.keys(r.values).forEach(function (k) {
      var c = el("div");
      c.appendChild(el("span", "k", k.replace(/_/g, " ")));
      c.appendChild(el("span", "v", num(r.values[k])));
      g.appendChild(c);
    });
    d.appendChild(g);
    if (r.note) d.appendChild(el("div", "note", r.note));
    var ids = el("div", "meta"); ids.appendChild(el("span", "id", r.series_ids.join(" · ")));
    d.appendChild(ids);
    return d;
  }

  function render(card, steps, a) {
    var pending = card.querySelector(".working");
    if (pending) pending.remove();
    card.insertBefore(el("div", "a", a.summary), steps.label);
    var n = (a.facts || []).length + (a.spreads || []).length + (a.readings || []).length;
    if (n) {
      card.insertBefore(el("div", "check " + (a.checked ? "ok" : "bad"), a.checked
        ? "✓ Every number was recomputed from the data after the answer was written."
        : "⚠ A number did not match the data on re-check. Treat this answer with care."), steps.label);
      card.insertBefore(el("div", "label", "Where the numbers came from"), steps.label);
      if ((a.facts || []).length + (a.spreads || []).length) card.insertBefore(sourcesTable(a), steps.label);
      (a.readings || []).forEach(function (r) { card.insertBefore(readingCard(r), steps.label); });
    }
    if (!steps.list.children.length) { steps.label.remove(); steps.list.remove(); }
    if ((a.caveats || []).length) {
      card.appendChild(el("div", "label", "Caveats"));
      var ul = el("ul", "caveats");
      a.caveats.forEach(function (c) { ul.appendChild(el("li", "", c)); });
      card.appendChild(ul);
    }
    card.appendChild(el("div", "foot", "answered in " + a.seconds + " s · " + String(a.model).replace("anthropic:", "") +
      (a.follow_up ? " · follow-up: earlier answers were context, numbers fetched again" : "")));
  }

  function fail(card, steps, message) {
    var pending = card.querySelector(".working");
    if (pending) pending.remove();
    card.insertBefore(el("div", "a err", message), steps.label);
    if (!steps.list.children.length) { steps.label.remove(); steps.list.remove(); }
  }

  function parseEvents(buffer, on) {
    var blocks = buffer.split("\n\n");
    var rest = blocks.pop();
    blocks.forEach(function (b) {
      var name = "message", data = "";
      b.split("\n").forEach(function (line) {
        if (line.indexOf("event: ") === 0) name = line.slice(7);
        else if (line.indexOf("data: ") === 0) data += line.slice(6);
      });
      if (data) { try { on(name, JSON.parse(data)); } catch (e) {} }
    });
    return rest;
  }

  function finish() {
    busy = false; go.disabled = false; turns += 1;
    box.value = ""; box.placeholder = "Ask a follow-up, or a new question…";
    convo.textContent = "Follow-ups remember this conversation. ";
    var b = el("button", "", "Start a new one"); b.type = "button";
    b.addEventListener("click", function () {
      session = null; turns = 0; thread.textContent = ""; convo.textContent = "";
      box.placeholder = "Ask about prices, stocks, curves, margins, positioning…"; box.focus();
    });
    convo.appendChild(b);
    loadStats();
  }

  function track(name, props) {  // counts only: the question text is never sent to analytics
    try { if (window.plausible) window.plausible(name, { props: props }); } catch (e) {}
  }

  function ask(q, how) {
    if (busy || !q) return;
    track("Question", { how: turns ? "follow-up" : (how || "typed") });
    busy = true; go.disabled = true;
    if (!session) session = newSession();
    Array.prototype.forEach.call(thread.children, function (c) { c.classList.add("old"); });
    var card = el("section", "card");
    card.appendChild(el("div", "label", "Question"));
    card.appendChild(el("div", "q", q));
    card.appendChild(el("div", "label", "Answer"));
    card.appendChild(el("div", "working", "The Librarian is reading"));
    var steps = { label: el("div", "label", "How it got there"), list: el("ol", "steps") };
    card.appendChild(steps.label); card.appendChild(steps.list);
    thread.insertBefore(card, thread.firstChild);
    var done = false;
    function on(name, data) {
      if (name === "tool") steps.list.appendChild(describe(data));
      else if (name === "answer") { done = true; render(card, steps, data); if (data.checked === false) track("Check failed", {}); }
      else if (name === "error") { done = true; fail(card, steps, data.error || "The Librarian could not answer that just now."); }
    }
    fetch("/api/ask/stream", { method: "POST", headers: { "Content-Type": "application/json" },
                               body: JSON.stringify({ question: q, session: session }) })
      .then(function (r) {
        var type = r.headers.get("Content-Type") || "";
        if (type.indexOf("text/event-stream") !== 0 || !r.body) {
          return r.json().then(function (j) { on(r.ok ? "answer" : "error", j); });
        }
        var reader = r.body.getReader(), decoder = new TextDecoder(), buffer = "";
        function pump() {
          return reader.read().then(function (chunk) {
            if (chunk.done) { parseEvents(buffer + "\n\n", on); return; }
            buffer = parseEvents(buffer + decoder.decode(chunk.value, { stream: true }), on);
            return pump();
          });
        }
        return pump();
      })
      .catch(function () {})
      .then(function () {
        if (!done) fail(card, steps, "The Librarian cannot be reached just now.");
        finish();
      });
  }

  function loadStats() {
    fetch("/api/stats").then(function (r) { return r.ok ? r.json() : null; }).then(function (s) {
      if (!s || s.answers < 20) return;  // a counter of three says nothing
      var since = new Date(s.since + "T00:00:00Z").toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
      document.getElementById("stats").textContent = s.answers.toLocaleString("en-GB") + " answers since " + since + " · " +
        (s.failed_check ? s.failed_check + " failed the re-check" : "none failed the re-check") +
        (s.median_seconds ? " · median " + s.median_seconds + " s" : "");
    }).catch(function () {});
  }

  document.getElementById("ask").addEventListener("submit", function (e) { e.preventDefault(); ask(box.value.trim()); });
  Array.prototype.forEach.call(document.querySelectorAll("#examples button"), function (b) {
    b.addEventListener("click", function () { box.value = b.textContent; ask(b.textContent, "example"); });
  });
  loadStats();
</script>

</body>
</html>
